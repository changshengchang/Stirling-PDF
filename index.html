<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PDF自行設計線上編輯</title>
    <meta name="description" content="強大且安全的 PDF 線上設計與編輯平台，支援新增文字、劃線標記、貼上截圖、合併、分割、旋轉與壓縮等全方位功能。" />
    <meta property="og:title" content="PDF自行設計線上編輯" />
    <meta property="og:description" content="強大且安全的 PDF 線上設計與編輯平台，支援新增文字、劃線標記、貼上截圖、合併、分割、旋轉與壓縮等全方位功能。" />
    <!-- Preload CJK Font and fontkit engine for instantaneous loading -->
    <link rel="preload" href="/fonts/NotoSansTC-Regular.ttf" as="fetch" crossorigin="anonymous" />
    <script src="/js/fontkit.umd.min.js"></script>
  </head>
  <body class="bg-neutral-50 text-neutral-900 antialiased">
    <div id="root">
      <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f9fafb;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
        <div style="text-align:center;">
          <div style="width:34px;height:34px;border:3px solid #e5e7eb;border-top-color:#dc2626;border-radius:50%;animation:spin 0.7s linear infinite;margin:0 auto 12px;"></div>
          <p style="color:#6b7280;font-size:13px;font-weight:500;">系統載入中，請稍候...</p>
        </div>
      </div>
      <style>@keyframes spin{to{transform:rotate(360deg)}}</style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
